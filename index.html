<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title, meta description, canonical, and og:/twitter: title+description+url
         are set PER ROUTE by useHead (App.vue) and baked into each prerendered
         page. Only the truly site-wide tags live here. -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="theme-color" content="#001B3D" />

    <!-- Open Graph (site-wide) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SAHA Institute For Learning" />
    <meta property="og:image" content="https://sahainstituteforlearning.com/logo.png" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ur_PK" />

    <!-- Twitter (site-wide) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://sahainstituteforlearning.com/logo.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["EducationalOrganization", "LocalBusiness"],
        "@id": "https://sahainstituteforlearning.com/#org",
        "name": "SAHA Institute For Learning",
        "alternateName": "SAHA",
        "description": "One-on-one tutoring in academics, Islamic studies, and standardized test prep for students ages 4 to 17.",
        "url": "https://sahainstituteforlearning.com/",
        "logo": "https://sahainstituteforlearning.com/logo.png",
        "image": "https://sahainstituteforlearning.com/logo.png",
        "foundingDate": "2020",
        "priceRange": "$$",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "1201 Vintage Drive",
          "addressLocality": "Kenner",
          "addressRegion": "LA",
          "postalCode": "70065",
          "addressCountry": "US"
        },
        "areaServed": [
          { "@type": "City", "name": "Kenner" },
          { "@type": "City", "name": "Metairie" },
          { "@type": "AdministrativeArea", "name": "Jefferson Parish" }
        ],
        "telephone": "+1-504-667-3625",
        "email": "sahaforlearning@gmail.com",
        "sameAs": [
          "https://www.instagram.com/sahainstituteforlearning/",
          "https://www.facebook.com/SahaForLearning"
        ],
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "15:15",
            "closes": "21:00"
          }
        ],
        "founder": {
          "@type": "Person",
          "name": "Anila Siddiqui"
        },
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Tutoring Programs",
          "itemListElement": [
            {
              "@type": "Course",
              "name": "Academics Tutoring",
              "description": "One-on-one tutoring in mathematics, science, and reading & writing.",
              "provider": { "@id": "https://sahainstituteforlearning.com/#org" },
              "offers": {
                "@type": "Offer",
                "priceCurrency": "USD",
                "priceSpecification": {
                  "@type": "UnitPriceSpecification",
                  "price": "30",
                  "priceCurrency": "USD",
                  "unitText": "HOUR"
                }
              }
            },
            {
              "@type": "Course",
              "name": "Islamic Studies",
              "description": "One-on-one Quran recitation, Tajwid, and memorization.",
              "provider": { "@id": "https://sahainstituteforlearning.com/#org" },
              "offers": {
                "@type": "Offer",
                "price": "250",
                "priceCurrency": "USD"
              }
            },
            {
              "@type": "Course",
              "name": "Standardized Test Prep",
              "description": "One-on-one AP, ACT, and LEAP preparation.",
              "provider": { "@id": "https://sahainstituteforlearning.com/#org" },
              "offers": {
                "@type": "Offer",
                "priceCurrency": "USD",
                "priceSpecification": {
                  "@type": "UnitPriceSpecification",
                  "price": "30",
                  "priceCurrency": "USD",
                  "unitText": "HOUR"
                }
              }
            }
          ]
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=Cormorant+Garamond:wght@600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="padding: 2rem; text-align: center; font-family: sans-serif;">
        SAHA Institute For Learning requires JavaScript. Please enable JavaScript to continue, or call us at (504) 667-3625.
      </p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
